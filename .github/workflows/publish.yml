name: publish

# 打 tag（v*）时发布到 npm。
#
# 与铁律顺序一致：commit → tag → push → publish。
# tag 推到 GitHub 的那一刻说明 Git 侧已就位，这时才允许发布——顺序由事件本身保证。
#
# 发布门禁由 `prepublishOnly` 把守（typecheck → build → verify → check:skills →
# check:matrix → test → verify-release）：工作区干净、HEAD 有 tag、tag 之后进包内容未变、
# CHANGELOG 有当前版本小节。任何一步红都不发布。
#
# 需要仓库 secret `NPM_TOKEN`（npm 的 Automation token，账号 58fly）。
#
# 产地签名（npm provenance）：从 0.2.2 起每次发布都带 SLSA provenance。
# 它要求三件事同时在位，缺一件 npm 会直接抛 EUSAGE 而不是默默降级：
#   1) 本 job 的 permissions 里有 `id-token: write`（OIDC 令牌，见下）；
#   2) 跑在受支持的托管 runner 上（这里就是 ubuntu-latest，不能是自建机）；
#   3) package.json 的 repository.url 指向公开仓库，且大小写与 owner/repo 一致。
# 不要改用 publishConfig.provenance：那样本地手工 `npm publish` 会因为没有 OIDC 直接报错，
# 而发布入口只在 CI 上带这个开关，落到 package.json 里反而让本地路径莫名其妙炸掉。

on:
  push:
    tags: ['v*']
  # 手动触发：发布失败后重跑，或在不打新 tag 的前提下验证这条流水线本身。
  # 它执行的是真实 `npm publish`；当前版本已发布时会以 E403 失败，属预期。
  workflow_dispatch:

env:
  # 与 ci.yml 同一个理由：pnpm-workspace.yaml 的 allowBuilds 是 pnpm 12 语法，
  # v10 会当成未知键忽略，esbuild 的 postinstall 不被放行，install 直接失败。
  PNPM_VERSION: 12.16.1

jobs:
  publish:
    runs-on: ubuntu-latest
    # 产地签名要拿 GitHub 的 OIDC 令牌换 Sigstore 的短期证书，缺 id-token: write
    # 时 npm 会在发布前抛 EUSAGE：Provenance generation in GitHub Actions requires
    # "write" access to the "id-token" permission。contents 只读即可——发布不改仓库。
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # prepublishOnly 要比较 tag..HEAD 的进包差异，必须拿到完整历史与 tag。
          # 默认 fetch-depth: 1 只拉单个 commit，tag 不可解析，检查会直接失败。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 这里刻意不单跑 pnpm test。lib/ 是 tsc 的构建产物并被 .gitignore 排除，
      # 干净检出里没有它，而 test/*.mjs 有 16 个文件从 ../lib/ 导入——单跑必然 18 条全红。
      # 测试由 prepublishOnly 的第六道门在 build 之后跑，那才是正确的顺序；
      # 在这里再跑一遍只会把一个假的顺序依赖引进来。
      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # npm publish（而不是 pnpm publish）：npm 不做 git 分支/工作区检查，
        # 那些检查已经由 prepublishOnly 里的 verify-release.mjs 做得更严格。
        #
        # --provenance：发布时顺带向 Sigstore 申请短期证书，把「这份字节是哪条流水线、
        # 哪个 commit 构建的」签成 attestation 一并传给 registry。npm 10.9.8 的
        # ensureProvenanceGeneration 会在 GitHub Actions 上检查 OIDC 环境变量，
        # 拿不到就抛 EUSAGE——所以它与上面的 permissions 是一对，删一个另一个就废。
        run: npm publish --provenance
